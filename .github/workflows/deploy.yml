# Pacote de deploy: roda os testes e publica as imagens Docker (só código) no GHCR. Rápido: nada de `npm run setup`
# completo aqui. Os dados do jogo (cartas, artes, motor, scripts) são gerados no homelab, na primeira subida, pelo serviço
# rushdaily-dados no volume rushdaily-dados (README, seção "Deploy pelo GitHub Actions").
name: Pacote de deploy

on:
  workflow_dispatch:
  # Todo push na master gera os pacotes de novo (latest + sha); tags v* também levam a versão.
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/clevim/rushdaily
  SYNC_IMAGE: ghcr.io/clevim/rushdaily-sync
  ADMIN_IMAGE: ghcr.io/clevim/rushdaily-admin

jobs:
  pacote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Só o que os testes do Rush, do desafio, do motor e da sincronização usam: ocgcore (npm) e o Rush do EDOPro
      # (BabelCDB e CardScripts, do GitHub). Uns poucos MB, sem ImageMagick, Pillow nem artes. Nada disso entra nas imagens
      # (o .dockerignore exclui src/vendor e src/data). Os testes do clássico rodam no homelab (painel admin › Testes).
      - name: Cache dos dados de teste
        uses: actions/cache@v5
        with:
          path: |
            tools/setup/libs/node_modules
            tools/rush/cache
            src/vendor
            src/data/rush
          key: teste-${{ hashFiles('tools/setup/setup.mjs', 'tools/setup/patch-ocgcore.mjs', 'tools/setup/libs/package-lock.json', 'tools/rush/import_rush.py') }}

      - name: Dados mínimos para os testes
        run: node tools/setup/setup.mjs --so ocgcore,rush-ocg

      - name: Testes
        run: npm run test:deploy

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas do site
        id: web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest

      - name: Etiquetas da sincronização
        id: sync
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SYNC_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest

      - name: Etiquetas do admin (ferramentas e dados)
        id: admin
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ADMIN_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest

      # Os testes já rodaram acima: o estágio "test" do Dockerfile não é alvo e o BuildKit o pula.
      # Cache de camadas no GitHub Actions: a camada do apk (Python, ImageMagick) do admin não é refeita a cada push.
      - name: Imagem do site (nginx)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.web.outputs.tags }}
          labels: ${{ steps.web.outputs.labels }}
          cache-from: type=gha,scope=site
          cache-to: type=gha,scope=site,mode=max

      - name: Imagem da sincronização (Node + SQLite)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.sync.outputs.tags }}
          labels: ${{ steps.sync.outputs.labels }}
          cache-from: type=gha,scope=sync
          cache-to: type=gha,scope=sync,mode=max

      - name: Imagem do admin (ferramentas do setup e painel)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/admin/Dockerfile
          push: true
          tags: ${{ steps.admin.outputs.tags }}
          labels: ${{ steps.admin.outputs.labels }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max
