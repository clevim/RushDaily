# Métodos: o site é só leitura (GET/HEAD); escrita só na API de sincronização (/api/, encaminhada ao rushdaily-sync).
map "$request_method:$uri" $method_blocked {
  "~^(GET|HEAD):" 0;
  "~^(PUT|POST|DELETE):/api/" 0;
  default 1;
}

server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Não anuncia a versão do nginx.
  server_tokens off;

  # IP real atrás do Cloudflare Tunnel (a API de sincronização limita por IP). Só confia no CF-Connecting-IP vindo das redes
  # privadas do Docker: o container não publica porta, então só o cloudflared (e os vizinhos de rede) chegam aqui.
  # Para fechar mais, troque pelas sub-redes exatas da rede do cloudflared (docker network inspect <rede>).
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header CF-Connecting-IP;

  if ($method_blocked) { return 405; }

  # Primeira subida: enquanto o serviço rushdaily-dados não gerou os dados no volume (/dados, somente leitura), as páginas
  # do jogo mostram "preparando" (recarrega sozinha) em vez de quebrar. rewrite + last no nível do server é uso seguro do if.
  if (!-f /dados/src/data/rush/cards.json) {
    rewrite ^/(?:index\.html|duel\.html|screens\.html|arena\.html)?$ /preparando.html last;
  }

  # Comprime texto e WASM: o pool clássico em JSON cai ~5x, os .lua ~6x, o .wasm ~3x.
  # gzip_vary + gzip_proxied any: a Cloudflare (proxy) recebe a versão comprimida e guarda as variantes sem confundir (ela refaz Brotli na borda).
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types application/json application/javascript text/javascript text/css image/svg+xml text/plain application/wasm;

  # Nada de documentação, ferramentas, markdown, dotfiles ou manifestos de pacote (mesmo que entrem na imagem por engano).
  # Vem primeiro: entre locations regex vale o primeiro que casa.
  location ~* (^/(docs|tools|tests|goat|node_modules|\.github)(/|$)|\.(py|sh|lock|map|log)$|/(?!LICENSE\.md$)[^/]*\.md$|/\.|/package(-lock)?\.json$|/(Dockerfile|nginx[^/]*\.conf|docker-compose[^/]*\.ya?ml)$) {
    include /etc/nginx/rushdaily-security.conf;
    return 404;
  }

  # Nunca em cache (nem na Cloudflare): some sozinha quando os dados ficam prontos.
  location = /preparando.html {
    include /etc/nginx/rushdaily-security.conf;
    add_header Cache-Control "no-store";
  }

  location = /healthz {
    access_log off;
    include /etc/nginx/rushdaily-security.conf;
    add_header Content-Type text/plain;
    return 200 'ok\n';
  }

  # API de sincronização (server/server.mjs). ^~: nenhum location regex abaixo pega /api/.
  # resolver + variável: o nginx sobe mesmo com o rushdaily-sync fora do ar (a API responde 502 até ele voltar).
  location ^~ /api/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $sync_upstream http://rushdaily-sync:8787;
    proxy_pass $sync_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # O servidor só confia neste cabeçalho; o do cliente é sobrescrito (e X-Forwarded-For não é repassado).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header CF-Connecting-IP "";
    client_max_body_size 1100k; # o servidor corta em 1 MiB e responde 413 em JSON
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_hide_header X-Content-Type-Options; # o include abaixo já manda (sem duplicar)
    include /etc/nginx/rushdaily-security.conf;
  }

  # ---- Cache (ver README, "Cache e Cloudflare") ----
  # Sem build não há nome com hash, então: código e dados = 5 min + stale-while-revalidate (o navegador e a borda servem a cópia
  # e atualizam em segundo plano); assets de nome estável = 7 dias; arquivos com hash no nome = 1 ano imutável.
  # `add_header` dentro de um location descarta os de fora: por isso o include de segurança em todos.
  location / {
    try_files $uri $uri/ =404;
    include /etc/nginx/rushdaily-security.conf;
    add_header Cache-Control "no-cache";
  }

  # ocgcore: os .js têm hash no nome (ocgcore.sync-OBPMIIOW.js): nunca mudam com o mesmo nome. index.js e chunk-* não têm hash: 5 min.
  location ~* /vendor/ocgcore/ocgcore\.(?:sync|jspi)-[A-Z0-9]+\.js$ {
    try_files $uri =404;
    include /etc/nginx/rushdaily-security.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Motor em WebAssembly, baixado cru (938 KB; ~333 KB com gzip). application/wasm é exigido para compilar em streaming.
  location ~* \.wasm$ {
    types { }
    default_type application/wasm;
    try_files $uri =404;
    include /etc/nginx/rushdaily-security.conf;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
  }

  # Scripts Lua das cartas (o duelo baixa ~85 por partida): o mime.types não conhece .lua (virava octet-stream e não comprimia).
  location ~* \.lua$ {
    types { }
    default_type text/plain;
    try_files $uri =404;
    include /etc/nginx/rushdaily-security.conf;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
  }

  # Módulos .mjs: o mime.types do nginx não conhece a extensão (vira octet-stream e o navegador recusa o import).
  location ~* \.mjs$ {
    types { }
    default_type text/javascript;
    try_files $uri =404;
    include /etc/nginx/rushdaily-security.conf;
    add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400";
  }

  # Código e páginas: 5 min. Uma atualização aparece em até 5 min (ou no próximo recarregamento, graças ao stale-while-revalidate).
  location ~* \.(?:css|js|html)$ {
    try_files $uri =404;
    include /etc/nginx/rushdaily-security.conf;
    add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400";
  }

  # Dados da temporada (pool, decks, puzzles): mudam a cada setup/temporada.
  location ~* \.json$ {
    try_files $uri =404;
    include /etc/nginx/rushdaily-security.conf;
    add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400";
  }

  # Imagens, fontes e o modelo do Enigma: nomes estáveis (id da carta), 7 dias. Para forçar uma arte nova: renomear ou purgar na Cloudflare.
  location ~* \.(?:png|jpg|jpeg|webp|avif|svg|ico|woff2|bin)$ {
    try_files $uri =404;
    include /etc/nginx/rushdaily-security.conf;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
  }
}
