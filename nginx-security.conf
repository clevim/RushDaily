# Cabeçalhos de segurança. Incluído em CADA location do nginx.conf: no nginx, qualquer add_header dentro de
# um location descarta os do nível server, então precisam ser repetidos via include.
# CSP validada contra todas as telas e a arena (motor WASM, booster 3D, Enigma): zero violações.
#  - 'wasm-unsafe-eval': o ocgcore sobe de WebAssembly (sem eval de JS).
#  - blob: em img/connect: cartas desenhadas no navegador; style 'unsafe-inline': style="--i:..." dos templates.
#  - fonts.googleapis.com / fonts.gstatic.com: só enquanto as fontes não forem hospedadas em src/assets/fonts (aí remover os dois).
# HSTS NÃO fica aqui: o tráfego interno é http; ligar na Cloudflare (SSL/TLS > Edge Certificates).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
